sonar.projectKey=greenback-innovations
sonar.organization=greenback-innovations

sonar.sources=apps/web/app,apps/web/modules,apps/web/infra,apps/web/shared
sonar.tests=apps/web/e2e
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/*.config.*,**/public/**
# Unit tests sit beside the code they cover, so they are inside sonar.sources -
# this reclassifies them as tests rather than duplicated production code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# JS/TS coverage (produced by `pnpm test:coverage` -> apps/web/coverage/lcov.info)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/coverage/lcov.info

# Quality gate: Clean as You Code (default) - see TDD section 5 for the exact
# conditions (0 new Blocker/Critical issues, >=80% coverage on new code, etc.),
# configured on the SonarCloud project itself, not here.
